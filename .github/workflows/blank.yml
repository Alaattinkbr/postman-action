name: API Test Report CI (Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  api-test:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install Newman & HTMLExtra Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Fetch Postman Environment
        run: |
          curl -L "https://testapi.turkiyeshell.com/maincore/enviroment/44656000-fdc57671-4929-4dd5-9a10-8ccf9efd690d" `
          -H "X-Api-Key: ${{ secrets.POSTMEN_KEY }}" `
          -o environment.json

      - name: Transform Environment File for Newman
        run: jq ".environment" environment.json > environment_transformed.json

      - name: Debug - Show environment file
        run: type environment_transformed.json

      - name: Run API tests with Newman and generate HTMLExtra report
        run: newman run ".\\postman\\collections\\One Hub.postman_collection.json" -e environment_transformed.json --reporters cli,htmlextra --reporter-htmlextra-export "newman-report.html"

      - name: Upload report to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          destination_dir: reports

      - name: Comment report link on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: newman-report
          message: |
            ✅ API test raporu hazır:  
            📄 [Newman HTML Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/newman-report.html)

