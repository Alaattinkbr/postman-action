name: API Test Report CI (Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install Newman and HTMLExtra Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Fetch Postman Environment
        run: |
          curl -X GET "https://api.getpostman.com/environments/6817abb559ad9700018da576-15958487f1d19c85dbc3991284c81a49fe" `
          -H "X-Api-Key: ${{ secrets.GOKHAN_KEY }}" `
          -o environment.json

      - name: Transform Environment File (JQ yerine PowerShell)
        run: |
          $envData = Get-Content environment.json | ConvertFrom-Json
          $envData.environment | ConvertTo-Json -Depth 10 | Out-File -Encoding UTF8 environment_transformed.json

      - name: Show contents of environment.json
        run: |
          Write-Output "Contents of environment.json"
          Get-Content environment.json

      - name: Debug - List files in workspace
        run: Get-ChildItem -Recurse

      - name: Run API tests with Newman and generate HTMLExtra report
        run: |
          newman run "${{ github.workspace }}\postman\collections\One Hub.json" `
          -e environment_transformed.json `
          --reporters cli,htmlextra `
          --reporter-htmlextra-export "newman-report.html"

      - name: Debug - Check if HTML report exists
        run: |
          if (Test-Path "newman-report.html") {
            Write-Output "Report generated successfully."
          } else {
            Write-Error "Report not found!"
          }

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: newman-report.html
