name: CI

on:
  push:
    branches: [ "Main" ]
  pull_request:
    branches: [ "Main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print hello message
        run: echo "Hello, world!"

      - name: Install Postman CLI on Windows
        run: |
          powershell -Command "[System.Net.ServicePointManager]::SecurityProtocol = 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://dl-cli.pstmn.io/install/win64.ps1'))"

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_KEY }}

      - name: Run API tests
        run: postman collection run "${env:GITHUB_WORKSPACE}\postman\collections\One Hub.json" -e "44656000-fdc57671-4929-4dd5-9a10-8ccf9efd690d"
